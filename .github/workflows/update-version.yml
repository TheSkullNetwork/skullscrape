name: Auto Increment Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version
        run: |
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          NEW_VERSION="0.1.${TOTAL_COMMITS}"
          echo "Updating version to ${NEW_VERSION}"
          
          python3 -c "
          import re
          with open('scraper.py', 'r') as f:
              content = f.read()
          new_content = re.sub(r'__version__\s*=\s*\".*?\"', '__version__ = \"' + '$NEW_VERSION' + '\"', content)
          with open('scraper.py', 'w') as f:
              f.write(new_content)
          "

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper.py
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-bump version to 0.1.$(git rev-list --count HEAD) [skip ci]"
            git push
          fi
